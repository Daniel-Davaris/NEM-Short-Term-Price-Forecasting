<div id="rmse-line-only">
  <style>
    #rmse-line-only, #rmse-line-only svg text { font-family: 'Times New Roman', Times, serif; }
    #rmse-line-only h2, #rmse-line-only .flow, #rmse-line-only .takeaway { display: none; }
    #rmse-line-only { width: 100%; color: var(--foreground); }
    #rmse-line-only .flow { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 10px 0 22px; }
    #rmse-line-only .step { padding: 8px 12px; background: color-mix(in srgb, var(--viz-series-1) 12%, transparent); border-radius: 8px; text-align: center; }
    #rmse-line-only .arrow { color: var(--muted-foreground); }
    #rmse-line-only .plots { display: grid; grid-template-columns: 1fr; gap: 26px; }
    #rmse-line-only .panel { min-width: 0; }
    #rmse-line-only h2 { margin: 0 0 4px; text-align: center; }
    #rmse-line-only h3 { margin: 0 0 6px; text-align: center; }
    #rmse-line-only .subtitle { color: var(--muted-foreground); text-align: center; margin-bottom: 8px; }
    #rmse-line-only svg { display: block; width: 100%; }
    #rmse-line-only .axis path,
    #rmse-line-only .axis line { stroke: var(--border); }
    #rmse-line-only .axis text,
    #rmse-line-only svg text { fill: var(--foreground); font-size: 12px; }
    #rmse-line-only .grid line { stroke: var(--border); stroke-opacity: 0.45; }
    #rmse-line-only .grid path { display: none; }
    #rmse-line-only .axis-title { fill: var(--foreground); }
    #rmse-line-only .takeaway { margin: 16px auto 0; max-width: 660px; padding: 10px 14px; text-align: center; background: color-mix(in srgb, var(--viz-series-2) 12%, transparent); border-radius: 8px; }
    @media (max-width: 560px) {
      #rmse-line-only .plots { grid-template-columns: 1fr; gap: 24px; }
    }
  </style>

  <h2>Why squared error becomes useful after price extremes are compressed</h2>

  <div class="plots">
    <section class="panel">
      <h3>Absolute and squared error in transformed space</h3>
      <svg id="penalty-plot" role="img" aria-label="MAE is a straight line while squared error curves upward as transformed absolute error increases."></svg>
    </section>
    
  </div>


  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById('rmse-line-only');
      const css = getComputedStyle(root);
      const color = name => css.getPropertyValue(name).trim();

      function drawPenalty() {
        const node = root.querySelector('#penalty-plot');
        const width = Math.max(300, node.parentElement.clientWidth);
        const height = width < 390 ? 285 : 310;
        const margin = {top: 18, right: 64, bottom: 52, left: 58};
        const svg = d3.select(node).attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
        svg.selectAll('*').remove();
        const x = d3.scaleLinear().domain([0, 3]).range([margin.left, width - margin.right]);
        const y = d3.scaleLinear().domain([0, 9]).nice().range([height - margin.bottom, margin.top]);
        const values = d3.range(0, 3.01, 0.05);

        svg.append('rect').attr('data-chart-frame', '').attr('x', margin.left).attr('y', margin.top)
          .attr('width', width-margin.left-margin.right).attr('height', height-margin.top-margin.bottom)
          .attr('fill', 'transparent').attr('stroke', color('--border'));
        svg.append('g').attr('class','grid').attr('transform',`translate(${margin.left},0)`)
          .call(d3.axisLeft(y).ticks(5).tickSize(-(width-margin.left-margin.right)).tickFormat(''));
        svg.append('g').attr('class','axis').attr('transform',`translate(0,${height-margin.bottom})`)
          .call(d3.axisBottom(x).ticks(width < 390 ? 4 : 6));
        svg.append('g').attr('class','axis').attr('transform',`translate(${margin.left},0)`)
          .call(d3.axisLeft(y).ticks(5));

        const line = accessor => d3.line().x(d => x(d)).y(d => y(accessor(d)))(values);
        svg.append('path').attr('d', line(d => d)).attr('fill','none').attr('stroke',color('--viz-series-1')).attr('stroke-width',3);
        svg.append('path').attr('d', line(d => d*d)).attr('fill','none').attr('stroke',color('--viz-series-2')).attr('stroke-width',3);
        svg.append('text').attr('x',x(2.95)).attr('y',y(2.95)-8).attr('text-anchor','end').attr('font-weight',500).text('MAE: |error|');
        svg.append('text').attr('x',x(2.95)).attr('y',y(2.95*2.95)+15).attr('text-anchor','end').attr('font-weight',500).text('L2 training loss: error^2');
        svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(margin.left+width-margin.right)/2).attr('y',height-10).attr('text-anchor','middle').text('Absolute error in transformed space');
        svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform','rotate(-90)').attr('x',-(margin.top+height-margin.bottom)/2).attr('y',15).attr('text-anchor','middle').text('Loss contribution');
      }

      function drawPressure() {
        const node = root.querySelector('#pressure-plot');
        const width = Math.max(300, node.parentElement.clientWidth);
        const height = width < 390 ? 285 : 310;
        const svg = d3.select(node).attr('viewBox',`0 0 ${width} ${height}`).attr('height',height);
        svg.selectAll('*').remove();
        const left = width < 390 ? 92 : 110;
        const right = 22;
        const barW = width-left-right;
        const bars = [
          {label:'MAE', big: 1.5/2.9},
          {label:'Squared error', big: 2.25/2.79}
        ];
        const ys = [78, 178];
        bars.forEach((d,i) => {
          const y = ys[i];
          const other = 1-d.big;
          svg.append('text').attr('x',left-10).attr('y',y+24).attr('text-anchor','end').attr('font-weight',500).text(d.label);
          svg.append('rect').attr('x',left).attr('y',y).attr('width',barW*other).attr('height',44).attr('fill',color('--muted'));
          svg.append('rect').attr('x',left+barW*other).attr('y',y).attr('width',barW*d.big).attr('height',44).attr('fill',color('--viz-series-2'));
          if (other > 0.25) svg.append('text').attr('x',left+barW*other/2).attr('y',y+27).attr('text-anchor','middle').text(`${Math.round(other*100)}% other errors`);
          svg.append('text').attr('x',left+barW*(other+d.big/2)).attr('y',y+27).attr('text-anchor','middle').attr('font-weight',500).text(`${Math.round(d.big*100)}% largest miss`);
        });
        svg.append('text').attr('x',left).attr('y',42).attr('fill',color('--muted-foreground')).text('Share of total training loss contribution');
        svg.append('text').attr('x',left).attr('y',258).attr('fill',color('--muted-foreground')).text('Highlighted error = 1.5 transformed units');
      }

      function draw() { drawPenalty(); }
      draw();
      new ResizeObserver(draw).observe(root);
    })();
  </script>
</div>
